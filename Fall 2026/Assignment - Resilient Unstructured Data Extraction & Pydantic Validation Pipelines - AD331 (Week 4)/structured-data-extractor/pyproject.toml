[project]
name = "structured-data-extractor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dara Sen", email = "darasen0277@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "instructor>=1.17.0",
    "json-repair>=0.64.2",
    "openai>=3.3.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
structured-data-extractor = "structured_data_extractor:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
