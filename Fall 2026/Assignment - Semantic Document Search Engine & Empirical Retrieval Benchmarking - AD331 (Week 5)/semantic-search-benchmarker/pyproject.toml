[project]
name = "semantic-search-benchmarker"
version = "0.1.0"
description = "Semantic document search engine and retrieval benchmark"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "tiktoken>=0.7",
    "streamlit>=1.38",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

