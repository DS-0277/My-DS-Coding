services:
  load_balancer:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - public_subnet
      - private_subnet
    depends_on:
      - backend_1
      - backend_2

  backend_1:
    build: ./backend
    environment:
      SERVER_ID: backend-1
    expose:
      - "3000"
    networks:
      - private_subnet

  backend_2:
    build: ./backend
    environment:
      SERVER_ID: backend-2
    expose:
      - "3000"
    networks:
      - private_subnet

networks:
  public_subnet:
    driver: bridge
  private_subnet:
    driver: bridge
    internal: true
