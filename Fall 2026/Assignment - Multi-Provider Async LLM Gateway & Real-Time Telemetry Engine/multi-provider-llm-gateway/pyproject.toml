[project]
name = "multi-provider-llm-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dara Sen", email = "darasen0277@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13.0",
    "fastapi>=0.143.0",
    "openai>=3.27.0",
    "pydantic>=2.14.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
multi-provider-llm-gateway = "multi_provider_llm_gateway:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false